# Build genesis on Linux with GCC and clang on every push and pull request.
#
# Development happens mostly on macOS, where the compiler is clang with a
# different set of headers, so a missing include or a GCC-only warning shows up
# here first. The build must be free of compiler warnings.

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A pull request from a branch of this repository is already built by its
    # push; build only pull requests from forks.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake zlib1g-dev

      - name: Configure
        run: |
          autoreconf -fi
          ./configure

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Fail on compiler warnings
        run: |
          if grep -E "warning:" build.log; then
            echo "::error::the build produced compiler warnings"
            exit 1
          fi

      - name: Check the binary runs
        run: ./src/genesis --version
